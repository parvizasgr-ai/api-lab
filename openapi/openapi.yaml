      security:
        - bearerAuth: []
      x-required-scopes: [bookings:write]
      x-db-impact:
        reads: [flight_bookings]
        writes: [UPDATE flight_bookings (status = CANCELLED), UPDATE flights (seats_left + N), INSERT audit_log]
