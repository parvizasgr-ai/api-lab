              examples:
                extension: { summary: Uzantı allowlist-də yoxdur, value: { timestamp: '2026-10-13T09:00:00Z', status: 415, code: UNSUPPORTED_MEDIA_TYPE, message: 'İcazəli fayl tipləri: pdf, pptx, docx, md', details: [{ field: file, message: 'Uzantı: .exe' }], traceId: req_7f2c9a } }
