        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422':
          description: STOLEN səbəbi ilə bloklanmış kart açıla bilməz və ya validation xətası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                stolen: { summary: Oğurlanmış kart, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: CARD_PERMANENTLY_BLOCKED, message: Oğurlanmış kimi bloklanmış kart açıla bilməz — yeni kart sifariş edin, details: [], traceId: req_7f2c9a } }
                validation: { summary: Bilinməyən sahə, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: VALIDATION_ERROR, message: Sorğu sxemə uyğun deyil, details: [{ field: /force, message: must NOT have additional properties }], traceId: req_7f2c9a } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # BANK — TRANSFERS
  # ==========================================================================
  /api/v1/transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Köçürmə (atomik, Idempotency-Key məcburi)
      description: |
        Bir DB transaction (`BEGIN IMMEDIATE`) daxilində: göndərən hesabdan DEBIT, alan hesaba CREDIT, `transfers` sətri.
        Hər hansı addım uğursuz olarsa **heç bir balans dəyişmir** (ROLLBACK).
        * Göndərən hesab sizin olmalıdır (alan istənilən hesab ola bilər).
        * Hər iki hesab və `currency` eyni valyutada olmalıdır → əks halda **422 CURRENCY_MISMATCH**.
        * Balans yetərsizdir → **422 INSUFFICIENT_FUNDS**.
        * `Idempotency-Key` yoxdursa → **422 IDEMPOTENCY_KEY_REQUIRED**. Eyni açarla təkrar → eyni cavab, yeni köçürmə yaranmır.
      security:
        - bearerAuth: []
      x-required-scopes: [transfers:write]
      x-db-impact:
        reads: [accounts, idempotency_keys]
        writes: [INSERT transfers, UPDATE accounts (2 sətir), INSERT transactions (DEBIT + CREDIT), INSERT audit_log (trigger), INSERT idempotency_keys]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
            examples:
              ok: { summary: Student → Rauf 25 AZN, value: { fromAccountId: AZ21NABZ0001, toAccountId: AZ21NABZ0004, amount: 25.00, currency: AZN } }
              insufficient: { summary: Balans yetərsiz, value: { fromAccountId: AZ21NABZ0001, toAccountId: AZ21NABZ0004, amount: 999999.00, currency: AZN } }
              mismatch: { summary: Valyuta uyğun deyil, value: { fromAccountId: AZ21NABZ0002, toAccountId: AZ21NABZ0004, amount: 10.00, currency: USD } }
      responses:
        '201':
          description: Köçürmə tamamlandı
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replayed: { $ref: '#/components/headers/Idempotent-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
              example: { id: 2, fromAccountId: AZ21NABZ0001, toAccountId: AZ21NABZ0004, amount: 25.00, currency: AZN, status: COMPLETED, createdAt: '2026-10-13T09:10:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenBola' }
        '404':
          description: Hesablardan biri tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: ACCOUNT_NOT_FOUND, message: 'Hesab tapılmadı: AZ21NABZ9999', details: [], traceId: req_7f2c9a }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422':
          description: Biznes qaydası və ya validation xətası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                insufficient: { summary: Balans yetərsiz, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: INSUFFICIENT_FUNDS, message: Hesabda kifayət qədər vəsait yoxdur, details: [{ field: amount, message: 'Mövcud balans: 4481.90 AZN' }], traceId: req_7f2c9a } }
                mismatch: { summary: Valyuta uyğun deyil, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: CURRENCY_MISMATCH, message: Hesabların valyutası və köçürmə valyutası eyni olmalıdır, details: [], traceId: req_7f2c9a } }
                sameAccount: { summary: Eyni hesab, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: SAME_ACCOUNT, message: Göndərən və alan hesab eyni ola bilməz, details: [], traceId: req_7f2c9a } }
                noKey: { summary: Idempotency-Key yoxdur, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: IDEMPOTENCY_KEY_REQUIRED, message: Sorğu sxemə uyğun deyil, details: [{ field: header Idempotency-Key, message: must have required property 'Idempotency-Key' }], traceId: req_7f2c9a } }
                keyReused: { summary: Eyni açar fərqli body ilə, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: IDEMPOTENCY_KEY_REUSED, message: Bu Idempotency-Key fərqli sorğu ilə artıq istifadə olunub, details: [], traceId: req_7f2c9a } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/transfers/{transferId}:
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Köçürmə detalları (201 cavabındakı Location bura göstərir)
      security:
        - bearerAuth: []
      x-required-scopes: [accounts:read]
