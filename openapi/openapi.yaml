    get:
      tags: [Hotels]
      operationId: listHotelBookings
      summary: Mənim otel bronlarım
      security:
        - bearerAuth: []
      x-required-scopes: [bookings:read]
      x-db-impact:
        reads: [hotel_bookings, hotel_rooms, hotels]
        writes: []
      responses:
        '200':
          description: Bronlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelBookingList' }
              example:
                items:
                  - { id: 2, roomId: 2, hotelId: 1, hotelName: Xəzər Sahil Hotel, roomType: DOUBLE, checkIn: '2026-10-23', checkOut: '2026-10-25', nights: 2, guests: 2, status: CONFIRMED, total: 756.00, currency: AZN, createdAt: '2026-10-10T11:00:00Z', updatedAt: '2026-10-10T11:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Hotels]
      operationId: createHotelBooking
      summary: Otel bron et
      description: |
        Transaction (`BEGIN IMMEDIATE`) daxilində eyni otaq üçün kəsişən CONFIRMED bron yoxlanılır:
        `yeni.checkIn < mövcud.checkOut AND yeni.checkOut > mövcud.checkIn` → **409 ROOM_NOT_AVAILABLE**.
        Yoxlama: `db/queries/10_hotel_overlap.sql`.
      security:
        - bearerAuth: []
      x-required-scopes: [bookings:write]
      x-db-impact:
        reads: [hotel_rooms, hotel_bookings]
        writes: [INSERT hotel_bookings, INSERT audit_log]
      requestBody:
