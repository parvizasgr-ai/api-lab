openapi: 3.0.3
info:
  title: API Lab
  version: 1.0.0
  contact:
    name: API Lab — Div Academy / UNEC
    email: parviz.asgr@gmail.com
  license:
    name: MIT (yalnız tədris məqsədli)
    url: https://opensource.org/licenses/MIT
  description: |
    **API Lab** — tələbələrin Postman/curl ilə real sorğu göndərdiyi və nəticəni SQL ilə yoxladığı təlim platforması.
    Bu fayl **single source of truth**-dur: server route-ları, request validation, Swagger UI (`/docs`) və Postman collection buradan yaranır.

    ## Konvensiyalar
    | Mövzu | Qayda |
    |---|---|
    | **Pul** | API-də **JSON number**, maksimum 2 onluq rəqəm (`multipleOf: 0.01`), məs. `125.50`. DB-də `*_minor INTEGER` (qəpik): `12550`. Çevirmə yalnız serverdə olur. |
    | **Vaxt** | ISO-8601 UTC: `2026-10-13T09:30:00Z`. Tarix: `2026-10-13`. |
    | **Sahə adları** | JSON-da `camelCase`. İstisna: OAuth2 token cavabları (`access_token`) — RFC 6749 standartına görə `snake_case`. |
    | **Validation** | Hər request body/query/path/header bu sxemə qarşı yoxlanılır (ajv). Bilinməyən sahə, səhv tip, enum xaricində dəyər → **422 VALIDATION_ERROR**. JSON parse olunmursa → **400 MALFORMED_JSON**. |
    | **Xəta formatı** | Bütün xətalar `Error` sxemindədir: `{timestamp, status, code, message, details[], traceId}`. Stack trace heç vaxt qaytarılmır. İstisna: `POST /oauth/token` RFC 6749 formatı (`{error, error_description}`). |
    | **Pagination** | `page` (1-dən) və `size` (1–100, default 20). Cavab: `{items, page, size, total, totalPages}`. Kitablar üçün əlavə **cursor** nümunəsi: `GET /api/v1/books`. |
    | **Rate limit** | Subyekt (token / API key / IP) başına **60 sorğu/dəqiqə**. Hər cavabda `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`; limit keçiləndə **429** + `Retry-After`. |
    | **Request ID** | Hər cavabda `X-Request-Id`. Xətada `traceId` ilə eynidir. Sorğuda `X-Request-Id` göndərsəniz, server onu istifadə edir. |
    | **Versioning** | `/api/v1`. `/api/v2/customers` — breaking change nümunəsi (`firstName`+`lastName` → `fullName`). v1 customers cavablarında `Deprecation`, `Sunset`, `Link` başlıqları. |

    ## Tədris simulyatorları
    İstənilən sorğuya `X-Simulate` başlığı əlavə edin (retry/timeout dərsi üçün):
    `500` → 500 INTERNAL_ERROR, `503` → 503 SERVICE_UNAVAILABLE + `Retry-After: 5`, `slow` → 3 san gecikmə, sonra normal cavab, `timeout` → 5 san sonra 504 GATEWAY_TIMEOUT.
    BFF-də simulyatoru bir bölməyə yönəltmək olar: `X-Simulate: hotels:503` → yalnız otel bölməsi xəta verir (207 Multi-Status).

    ## Extension-lar
    * `x-db-impact` — endpoint-in DB təsiri: `reads` (SELECT edilən cədvəllər) və `writes` (INSERT/UPDATE/DELETE). Bütün sorğular əlavə olaraq `request_log` və `rate_limit_counters`-ə yazır (orada göstərilmir).
    * `x-required-scopes` — JWT `scope` claim-ində olmalı scope-lar. Yoxdursa **403 INSUFFICIENT_SCOPE**.
    * `x-rate-limit` — endpoint-ə xas, ümumidən sərt limit (sorğu/dəqiqə), məs. SQL Playground: 20.
    * `x-error-format: oauth2` — həmin endpoint-in xətaları RFC 6749 formatındadır (`{error, error_description}`), validation xətası → 400 `invalid_request`.
    * `x-error-code` (schema daxilində) — həmin sahənin validation xətası ümumi `VALIDATION_ERROR` əvəzinə bu kodla qaytarılır (məs. `INVALID_REASON`).

    ## Demo istifadəçilər
    `student/student123` (bütün scope-lar), `rauf/rauf123` (`cards:write` yoxdur), `admin/admin123` (ADMIN). API Key: `apilab-demo-key-2026`.
servers:
  - url: http://localhost:3000
    description: Lokal server
tags:
  - name: Auth
    description: Login, JWT access/refresh token, Basic Auth nümunəsi
  - name: OAuth2
    description: Mock "Google" Authorization Server — Authorization Code flow
  - name: Accounts
    description: Bank hesabları və əməliyyatlar (Bearer)
  - name: Cards
    description: Kartlar, blok/unblock, Idempotency, BOLA nümunəsi (Bearer)
  - name: Transfers
    description: Hesablar arası köçürmə — atomik DB transaction, Idempotency-Key məcburi
  - name: Currencies
    description: Valyuta və məzənnələr (X-API-Key)
  - name: Flights
    description: Aviabilet axtarışı və bron
  - name: Hotels
    description: Otel axtarışı (availability SQL ilə) və bron
  - name: Customers
    description: Tam CRUD — Safe/Idempotent metodlar, ETag, HEAD/OPTIONS, JSON vs XML, versioning
  - name: Books
    description: Kitab axtarışı (X-API-Key), offset və cursor pagination, rəylər
  - name: Music
    description: Musiqi axtarışı, YouTube IFrame ilə oxutma, playlist-lər
  - name: BFF
    description: Backend-for-Frontend — UI üçün aqreqasiya, `meta.calls`, partial failure (207)
  - name: External APIs
    description: |
      RapidAPI Hub-dakı real API-lər proxy ilə (`/external/*`). Tələbə **öz** RapidAPI açarını `X-RapidAPI-Key` başlığı ilə göndərir —
      server onu yalnız ötürür, heç yerdə saxlamır (DB, log, `/_history`). Proxy yalnız kataloqdakı host/path/query-lərə gedir (SSRF qoruması);
      `verified: false` API-lər 404 qaytarır. Upstream 401/403/429/5xx → 502/504 (vahid xəta formatı).
  - name: SQL Playground
    description: Tələbələrin DB-ni yalnız SELECT ilə yoxlaması
  - name: Materials
    description: Dərs materialları — yükləmə (PDF/PPTX/DOCX/MD), asinxron konvertasiya, səhifə viewer-i, pre-signed URL-lər
  - name: Tasks
    description: Dərs tapşırıqları (endpoint + gözlənilən status + SQL yoxlaması) və tələbə irəliləyişi
  - name: Admin
    description: Sistem əməliyyatları (DB reset, sorğu tarixçəsi)
  - name: Meta
    description: Health, OpenAPI sənədi, Postman collection

paths:
  # ==========================================================================
  # AUTH
  # ==========================================================================
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Login — access və refresh token al
      description: |
        Username/parol yoxlanılır. Eyni username üçün 5 dəqiqədə `LOGIN_MAX_FAILURES` (default 10) uğursuz cəhddən sonra pəncərə bitənə qədər **429** + `Retry-After` (brute-force qoruması).
        Cavabda **access_token** (JWT, HS256, 15 dəqiqə; claim-lər: `sub`, `jti`, `username`, `role`, `scope`, `iat`, `exp`)
        və **refresh_token** (7 gün, DB-də yalnız SHA-256 hash-i saxlanır) qaytarılır.
      x-db-impact:
        reads: [users, user_scopes]
        writes: [INSERT refresh_tokens, INSERT audit_log]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              student: { value: { username: student, password: student123 } }
              rauf: { value: { username: rauf, password: rauf123 } }
      responses:
        '200':
          description: Uğurlu login
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwic2NvcGUiOiJhY2NvdW50czpyZWFkIn0.sig
                token_type: Bearer
                expires_in: 900
                refresh_token: rt_8f3a1c0e9b7d4f2a8c6e1b3d5f7a9c0e
                scope: accounts:read cards:read cards:write transfers:write bookings:read bookings:write books:write music:write
        '401':
          description: Username və ya parol səhvdir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: INVALID_CREDENTIALS, message: Username və ya parol səhvdir, details: [], traceId: req_7f2c9a }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Refresh token ilə yeni access token al (rotation)
      description: Köhnə refresh token ləğv edilir (`revoked_at`), yenisi verilir — refresh token rotation.
      x-db-impact:
        reads: [refresh_tokens, users, user_scopes]
        writes: [UPDATE refresh_tokens (revoked_at), INSERT refresh_tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refresh_token: rt_8f3a1c0e9b7d4f2a8c6e1b3d5f7a9c0e }
      responses:
        '200':
          description: Yeni token cütü
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.sig
                token_type: Bearer
                expires_in: 900
                refresh_token: rt_1b2c3d4e5f60718293a4b5c6d7e8f901
                scope: accounts:read cards:read
        '401':
          description: Refresh token etibarsız, vaxtı keçmiş və ya ləğv edilib
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: INVALID_REFRESH_TOKEN, message: Refresh token etibarsızdır və ya ləğv edilib, details: [], traceId: req_7f2c9a }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Logout — refresh token-i və cari access token-i ləğv et
      description: Refresh token ləğv olunur. Access token (JWT) imza baxımından exp-ə qədər etibarlı olsa da, onun `jti`-si denylist-ə (`revoked_access_tokens`) yazılır — logout-dan sonra həmin token 401 `INVALID_TOKEN` alır.
      security:
        - bearerAuth: []
      x-db-impact:
        reads: [refresh_tokens]
        writes: [UPDATE refresh_tokens (revoked_at)]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refresh_token: rt_8f3a1c0e9b7d4f2a8c6e1b3d5f7a9c0e }
      responses:
        '204':
          description: Refresh token ləğv edildi (cavab gövdəsi yoxdur)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Cari istifadəçi (token-in sahibi)
      security:
        - bearerAuth: []
      x-db-impact:
        reads: [users, user_scopes]
        writes: []
      responses:
        '200':
          description: İstifadəçi profili
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 1, username: student, fullName: Aysel Məmmədova, email: student@apilab.az, role: USER, scopes: [accounts:read, cards:read, cards:write] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/basic-demo:
    get:
      tags: [Auth]
      operationId: authBasicDemo
      summary: Basic Auth nümunəsi
      description: '`Authorization: Basic base64(username:password)`. Base64 şifrələmə deyil — yalnız HTTPS ilə istifadə olunmalıdır.'
      security:
        - basicAuth: []
      x-db-impact:
        reads: [users]
        writes: []
      responses:
        '200':
          description: Basic Auth uğurlu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicDemoResponse' }
              example: { authScheme: Basic, username: student, message: 'Basic Auth uğurludur. Diqqət: base64 şifrələmə deyil!', decodedHeader: 'student:********' }
        '401':
          description: Basic credential yoxdur və ya səhvdir (`WWW-Authenticate` başlığı ilə)
          headers:
            WWW-Authenticate:
              schema: { type: string }
              example: Basic realm="API Lab"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: INVALID_CREDENTIALS, message: Basic credential səhvdir, details: [], traceId: req_7f2c9a }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # OAUTH2 (mock Google Authorization Server)
  # ==========================================================================
  /oauth/authorize:
    get:
      tags: [OAuth2]
      operationId: oauthAuthorizePage
      summary: Authorization endpoint — "Google ilə daxil ol" razılıq (consent) səhifəsi
      description: |
        Authorization Code flow-nun 1-ci addımı. Brauzer bu URL-ə yönləndirilir, istifadəçi hesab seçir və icazə verir.
        SPA üçün: `Accept: application/json` → HTML əvəzinə client, scope və seçilə bilən hesablar JSON kimi qaytarılır.
        `state` məcburidir (CSRF qoruması) — client geri qayıdan `state`-i özündəki ilə müqayisə etməlidir.
      x-db-impact:
        reads: [oauth_clients, users]
        writes: []
      parameters:
        - { $ref: '#/components/parameters/OAuthResponseType' }
        - { $ref: '#/components/parameters/OAuthClientId' }
        - { $ref: '#/components/parameters/OAuthRedirectUri' }
        - { $ref: '#/components/parameters/OAuthScope' }
        - { $ref: '#/components/parameters/OAuthState' }
      responses:
        '200':
          description: HTML consent səhifəsi (hesab seçimi + "İcazə ver" / "İmtina") və ya JSON (Accept application/json)
          content:
            text/html:
              schema: { type: string }
              example: '<!doctype html><html><body><h1>Google ilə daxil ol</h1>...</body></html>'
            application/json:
              schema: { $ref: '#/components/schemas/OAuthConsentInfo' }
              example: { client: { clientId: apilab-portal, name: API Lab Portal }, redirectUri: 'http://localhost:5173/oauth/callback', scope: openid profile email, state: xyz-12345678, accounts: [{ username: student, fullName: Aysel Məmmədova, email: student@apilab.az }] }
        '400':
          description: client_id və ya redirect_uri qeydiyyatda yoxdur (redirect edilmir — açıq redirect hücumunun qarşısı alınır)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { timestamp: '2026-10-13T09:00:00Z', status: 400, code: INVALID_REDIRECT_URI, message: redirect_uri bu client üçün qeydiyyatda deyil, details: [], traceId: req_7f2c9a }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [OAuth2]
      operationId: oauthAuthorizeDecision
      summary: Consent qərarı — authorization code yarat və redirect et
      description: |
        Consent formu buraya göndərilir. `decision=allow` → `302 Location: {redirect_uri}?code=...&state=...`.
        `decision=deny` → `302 Location: {redirect_uri}?error=access_denied&state=...`. Code **birdəfəlikdir** və **60 saniyə** yaşayır.
        `decision=allow` üçün seçilmiş hesabın parolu tələb olunur (real Google-da olduğu kimi). OAuth token-lərinə `admin` scope-u heç vaxt verilmir.
        SPA üçün: `Accept: application/json` → 302 əvəzinə `200 {location}` (fetch 302-nin Location başlığını oxuya bilmir), səhv parol → 401 JSON.
      x-db-impact:
        reads: [oauth_clients, users]
        writes: [INSERT oauth_codes]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthConsentForm' }
            example: { client_id: apilab-portal, redirect_uri: 'http://localhost:5173/oauth/callback', scope: openid profile email, state: xyz-12345678, username: student, password: student123, decision: allow }
      responses:
        '200':
          description: 'Accept: application/json — yönləndiriləcək ünvan (code + state və ya error)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthRedirect' }
              example: { location: 'http://localhost:5173/oauth/callback?state=xyz-12345678&code=ac_5d1e2f3a4b5c6d7e' }
        '302':
          description: redirect_uri-yə yönləndirmə (code və ya error ilə)
          headers:
            Location:
              schema: { type: string, format: uri }
              example: http://localhost:5173/oauth/callback?code=ac_5d1e2f3a4b5c6d7e&state=xyz-12345678
        '400':
          description: client_id/redirect_uri səhvdir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { timestamp: '2026-10-13T09:00:00Z', status: 400, code: INVALID_REDIRECT_URI, message: redirect_uri bu client üçün qeydiyyatda deyil, details: [], traceId: req_7f2c9a }
        '401':
          description: Parol səhvdir — consent səhifəsi xəta mesajı ilə yenidən göstərilir (JSON client-ə — vahid xəta formatı)
          content:
            text/html:
              schema: { type: string }
              example: '<!doctype html><html><body><p class="error">Parol səhvdir</p>...</body></html>'
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: INVALID_CREDENTIALS, message: Parol səhvdir, details: [], traceId: req_7f2c9a }
        '404':
          description: Seçilmiş istifadəçi tapılmadı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: USER_NOT_FOUND, message: İstifadəçi tapılmadı, details: [], traceId: req_7f2c9a }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /oauth/token:
    post:
      tags: [OAuth2]
      operationId: oauthToken
      summary: Token endpoint — authorization code-u access token-ə dəyiş
      x-error-format: oauth2
      description: |
        Server-to-server (back channel) sorğu. Client özünü `client_id` + `client_secret` ilə (form sahələri və ya Basic Auth) təsdiq edir.
        Xətalar (validation daxil) **RFC 6749** formatındadır (`x-error-format: oauth2`): `invalid_request`, `invalid_client`, `invalid_grant` (code vaxtı keçib / artıq istifadə olunub / redirect_uri uyğun deyil), `unsupported_grant_type`.
      x-db-impact:
        reads: [oauth_clients, oauth_codes, users, user_scopes]
        writes: [UPDATE oauth_codes (used_at), INSERT refresh_tokens (scope = verilmiş scope), INSERT audit_log]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthTokenForm' }
            example: { grant_type: authorization_code, code: ac_5d1e2f3a4b5c6d7e, redirect_uri: 'http://localhost:5173/oauth/callback', client_id: apilab-portal, client_secret: apilab-portal-secret }
      responses:
        '200':
          description: Access token
          headers:
            Cache-Control:
              schema: { type: string }
              example: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthTokenResponse' }
              example: { access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.sig, token_type: Bearer, expires_in: 900, refresh_token: rt_4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f, scope: openid profile email }
        '400':
          description: RFC 6749 xətası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                codeReused: { summary: Code ikinci dəfə istifadə olunub, value: { error: invalid_grant, error_description: Authorization code artıq istifadə olunub } }
                codeExpired: { summary: Code-un 60 saniyəsi bitib, value: { error: invalid_grant, error_description: Authorization code-un vaxtı keçib } }
                redirectMismatch: { summary: redirect_uri uyğun deyil, value: { error: invalid_grant, error_description: redirect_uri authorize addımındakı ilə eyni deyil } }
                wrongGrant: { summary: Dəstəklənməyən grant_type, value: { error: unsupported_grant_type, error_description: Yalnız authorization_code dəstəklənir } }
        '401':
          description: Client autentifikasiyası uğursuz (RFC 6749 invalid_client)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              example: { error: invalid_client, error_description: client_id və ya client_secret səhvdir }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
