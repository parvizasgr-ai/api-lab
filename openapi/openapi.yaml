        - bearerAuth: []
      x-required-scopes: [admin]
      x-db-impact:
        reads: []
        writes: [INSERT materials, 'UPDATE materials (status — fon işi)', 'INSERT material_pages (fon işi)', INSERT audit_log]
      requestBody:
        required: true
        content:
