  /api/v1/cards/{cardId}/block:
    post:
      tags: [Cards]
      operationId: blockCard
      summary: Kartı blokla
      description: |
        **Tam nümunə endpoint** (Dərs 3).
        * `reason` yalnız `LOST | STOLEN | SUSPECTED_FRAUD` — başqa dəyər (məs. `{"reason": "BROKEN"}`) → **422 INVALID_REASON**.
        * `Idempotency-Key` (opsional, tövsiyə olunur): eyni açarla təkrar sorğu → ilk cavab təkrar qaytarılır (`Idempotent-Replayed: true`), əməliyyat ikinci dəfə icra olunmur.
          Eyni açar fərqli body ilə → **422 IDEMPOTENCY_KEY_REUSED**.
        * Açarsız ikinci blok cəhdi → **409 CARD_ALREADY_BLOCKED**.
        * Başqasının kartı → **403 FORBIDDEN** (BOLA). Scope `cards:write` yoxdursa (məs. `rauf`) → **403 INSUFFICIENT_SCOPE**.
        * DB-də: `cards.status = 'BLOCKED'`, trigger `card_status_history`-ə 1 sətir yazır. Yoxlama: `db/queries/04_card_block_check.sql`.
      security:
        - bearerAuth: []
      x-required-scopes: [cards:write]
      x-db-impact:
        reads: [cards, idempotency_keys]
        writes: [UPDATE cards, INSERT card_status_history (trigger), INSERT idempotency_keys, INSERT audit_log]
      parameters:
        - { $ref: '#/components/parameters/CardId' }
        - { $ref: '#/components/parameters/IdempotencyKeyOptional' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockCardRequest' }
            examples:
              lost: { summary: Kart itib, value: { reason: LOST, comment: Metroda itirdim } }
              stolen: { summary: Kart oğurlanıb (unblock mümkün deyil), value: { reason: STOLEN } }
      responses:
        '200':
          description: Kart bloklandı
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotent-Replayed: { $ref: '#/components/headers/Idempotent-Replayed' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/X-RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardStatusChangeResponse' }
              example: { cardId: 1, previousStatus: ACTIVE, status: BLOCKED, reason: LOST, comment: Metroda itirdim, changedAt: '2026-10-13T09:00:00Z', message: Kart bloklandı }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Başqasının kartı (BOLA) və ya `cards:write` scope-u yoxdur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                bola: { summary: Başqasının kartı, value: { timestamp: '2026-10-13T09:00:00Z', status: 403, code: FORBIDDEN, message: Bu resursa giriş icazəniz yoxdur, details: [], traceId: req_7f2c9a } }
                scope: { summary: Scope çatışmır, value: { timestamp: '2026-10-13T09:00:00Z', status: 403, code: INSUFFICIENT_SCOPE, message: 'Bu əməliyyat üçün cards:write scope-u lazımdır', details: [{ field: scope, message: 'Tələb olunur: cards:write' }], traceId: req_7f2c9a } }
        '404': { $ref: '#/components/responses/CardNotFound' }
        '409':
          description: Kart artıq bloklanıb və ya müddəti bitib
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                alreadyBlocked: { summary: Artıq bloklanıb, value: { timestamp: '2026-10-13T09:00:00Z', status: 409, code: CARD_ALREADY_BLOCKED, message: Kart artıq bloklanıb, details: [], traceId: req_7f2c9a } }
                expired: { summary: Müddəti bitib, value: { timestamp: '2026-10-13T09:00:00Z', status: 409, code: CARD_EXPIRED, message: Kartın müddəti bitib, details: [], traceId: req_7f2c9a } }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422':
          description: Validation xətası
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidReason: { summary: Səhv reason, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: INVALID_REASON, message: Sorğu sxemə uyğun deyil, details: [{ field: /reason, message: 'must be equal to one of the allowed values: LOST, STOLEN, SUSPECTED_FRAUD' }], traceId: req_7f2c9a } }
                unknownField: { summary: Bilinməyən sahə, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: VALIDATION_ERROR, message: Sorğu sxemə uyğun deyil, details: [{ field: /urgent, message: must NOT have additional properties }], traceId: req_7f2c9a } }
                keyReused: { summary: Eyni Idempotency-Key fərqli body ilə, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: IDEMPOTENCY_KEY_REUSED, message: Bu Idempotency-Key fərqli sorğu ilə artıq istifadə olunub, details: [], traceId: req_7f2c9a } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/cards/{cardId}/unblock:
    post:
      tags: [Cards]
      operationId: unblockCard
      summary: Kartı blokdan çıxar
      description: Yalnız `LOST` və ya `SUSPECTED_FRAUD` səbəbi ilə bloklanmış kartlar. `STOLEN` → **422 CARD_PERMANENTLY_BLOCKED**.
      security:
