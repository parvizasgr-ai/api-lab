  # ==========================================================================
  # BFF (Backend-for-Frontend)
  # ==========================================================================
  /bff/dashboard:
    get:
      tags: [BFF]
      operationId: bffDashboard
      summary: Bank dashboard — 1 sorğuda hesablar + kartlar + son 5 əməliyyat + AZN/USD/EUR məzənnələri
      description: |
        BFF eyni service layer-i birbaşa çağırır (HTTP-yə yenidən çıxmır). Daxili çağırışlar paralel işləyir,
        `meta.calls` hər birinin adını, statusunu və müddətini göstərir. Portal birbaşa API ilə 4 sorğu əvəzinə 1 sorğu göndərir.
      security:
        - bearerAuth: []
      x-required-scopes: [accounts:read, cards:read]
      x-db-impact:
        reads: [accounts, cards, transactions, exchange_rates]
        writes: []
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BffDashboard' }
              example:
                user: { id: 1, username: student, fullName: Aysel Məmmədova }
                accounts: [{ id: AZ21NABZ0001, type: CURRENT, currency: AZN, balance: 4481.90, openedAt: '2025-09-28T10:00:00Z' }]
                cards: [{ id: 1, accountId: AZ21NABZ0001, maskedNumber: '**** **** **** 4169', last4: '4169', brand: VISA, status: ACTIVE, statusReason: null, dailyLimit: 2000.00, currency: AZN, expiresAt: '2029-09-30' }]
                recentTransactions: [{ id: 40, accountId: AZ21NABZ0001, type: DEBIT, amount: 7.80, currency: AZN, description: Bolt — taksi, transferId: null, createdAt: '2026-10-12T19:00:00Z' }]
                rates: { base: AZN, date: '2026-10-13', rates: { USD: 0.588235, EUR: 0.506329 } }
                meta: { totalMs: 3, partial: false, calls: [{ name: accounts.list, status: 200, durationMs: 1 }, { name: cards.list, status: 200, durationMs: 1 }, { name: transactions.recent, status: 200, durationMs: 1 }, { name: currencies.rates, status: 200, durationMs: 1 }] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /bff/travel/search:
    get:
      tags: [BFF]
      operationId: bffTravelSearch
      summary: Reys + otel paralel axtarışı (partial failure → 207)
      description: |
        Reys və otel axtarışı `Promise.all` ilə paralel işləyir; hər daxili çağırışın **3 saniyə** limiti var.
        Hər bölmə öz statusunu daşıyır: `{status: 200, data}` və ya `{status: 503|504|..., error}` (vahid Error formatı, öz `traceId`-si ilə).
        Hər iki bölmə uğurlu → **200**. Ən azı biri uğursuz → **207 Multi-Status** və `meta.partial = true`.

        **Hissəvi xətanı yaratmaq:** `X-Simulate: hotels:503` (və ya `flights:500`, `hotels:timeout`, `hotels:slow`) — simulyator yalnız həmin bölməyə tətbiq olunur.
        Adi `X-Simulate: 503` isə bütün sorğunu dayandırır — fərqi müqayisə edin.
      security:
        - bearerAuth: []
      x-required-scopes: [bookings:read]
      x-db-impact:
        reads: [flights, airports, hotels, hotel_rooms, hotel_bookings, hotel_amenities, exchange_rates]
        writes: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/AirportCode' }
          example: GYD
        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/AirportCode' }
          example: IST
        - name: date
          in: query
          required: true
          description: Uçuş və check-in tarixi
          schema: { type: string, format: date }
          example: '2026-10-20'
        - name: city
          in: query
          description: Otel şəhəri (verilməsə — `to` hava limanının şəhəri)
          schema: { type: string, minLength: 2, maxLength: 50 }
        - name: nights
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 3 }
        - name: adults
          in: query
          schema: { type: integer, minimum: 1, maximum: 6, default: 1 }
      responses:
        '200':
          description: Hər iki axtarış uğurlu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BffTravel' }
              example:
                flights: { status: 200, data: { items: [{ id: 17, flightNo: J2 071, airline: { code: J2, name: Azerbaijan Airlines }, from: { code: GYD, city: Bakı }, to: { code: IST, city: İstanbul }, departAt: '2026-10-20T05:00:00Z', arriveAt: '2026-10-20T08:40:00Z', durationMin: 220, stops: 0, price: 340.00, currency: AZN, seatsLeft: 12 }], total: 1 } }
                hotels: { status: 200, data: { items: [{ id: 11, name: Sultanahmet Garden, city: İstanbul, stars: 3, rating: 8.6, pricePerNightFrom: 75.00, currency: EUR, pricePerNightFromAzn: 148.13, amenities: [Wi-Fi, Səhər yeməyi], availableRooms: 3 }], total: 1 } }
                meta: { totalMs: 5, partial: false, calls: [{ name: flights.search, status: 200, durationMs: 4 }, { name: hotels.search, status: 200, durationMs: 5 }] }
        '207':
          description: Hissəvi uğur — bir və ya hər iki bölmə xəta verdi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BffTravel' }
              examples:
                hotelsUnavailable:
                  summary: 'X-Simulate: hotels:503'
