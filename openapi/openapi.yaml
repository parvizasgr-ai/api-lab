  # ==========================================================================
  # BOOKS (X-API-Key)
  # ==========================================================================
  /api/v1/books:
    get:
      tags: [Books]
      operationId: listBooksCursor
      summary: Kitablar — cursor pagination nümunəsi
      description: |
        Offset (`page`) əvəzinə **cursor**: cavabdakı `nextCursor`-u növbəti sorğuda `cursor` kimi göndərin.
        `nextCursor = null` → son səhifə. Üstünlüyü: siyahıya yeni sətir əlavə olunanda səhifələr "sürüşmür".
      security:
        - apiKeyAuth: []
      x-db-impact:
        reads: [books]
        writes: []
      parameters:
        - name: cursor
          in: query
          description: Əvvəlki cavabın `nextCursor` dəyəri (opaque string)
          schema: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Kitablar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookCursorPage' }
              example:
                items:
                  - { id: 1, title: Kitabi-Dədə Qorqud, author: Anonim, genre: Dastan, year: null, description: Oğuz türklərinin qəhrəmanlıq dastanları toplusu., rating: 4.8, pages: 320 }
                limit: 1
                nextCursor: aWQ6MQ
        '401': { $ref: '#/components/responses/UnauthorizedApiKey' }
        '422':
          description: Validation xətası və ya etibarsız cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                badCursor: { summary: Cursor etibarsızdır, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: INVALID_CURSOR, message: Cursor etibarsızdır, details: [], traceId: req_7f2c9a } }
                validation: { summary: limit > 100, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: VALIDATION_ERROR, message: Sorğu sxemə uyğun deyil, details: [{ field: query limit, message: must be <= 100 }], traceId: req_7f2c9a } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/books/search:
    get:
      tags: [Books]
      operationId: searchBooks
      summary: Kitab axtarışı (offset pagination)
      security:
        - apiKeyAuth: []
      x-db-impact:
        reads: [books]
        writes: []
      parameters:
