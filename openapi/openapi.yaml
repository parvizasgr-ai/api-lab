              schema: { $ref: '#/components/schemas/CardStatusChangeResponse' }
              example: { cardId: 3, previousStatus: BLOCKED, status: ACTIVE, reason: null, comment: Kartı tapdım, changedAt: '2026-10-13T09:05:00Z', message: Kart blokdan çıxarıldı }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenBola' }
        '404': { $ref: '#/components/responses/CardNotFound' }
        '409':
