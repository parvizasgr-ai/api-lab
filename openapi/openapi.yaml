      summary: Müştəri (ETag + If-None-Match → 304)
      description: |
        Cavabda `ETag` başlığı var. Növbəti sorğuda `If-None-Match: <etag>` göndərin — data dəyişməyibsə **304 Not Modified** (gövdəsiz) qayıdır.
