              schema: { $ref: '#/components/schemas/Customer' }
              example: { id: 1, firstName: Nigar, lastName: Əliyeva, email: nigar.aliyeva@example.az, phone: '+994501234501', city: Bakı, active: true, createdAt: '2026-04-06T09:13:00Z', updatedAt: '2026-04-06T09:13:00Z' }
            application/xml:
              schema: { type: string, description: Customer-in XML təqdimatı }
              example: '<customer><id>1</id><firstName>Nigar</firstName><lastName>Əliyeva</lastName><email>nigar.aliyeva@example.az</email><phone>+994501234501</phone><city>Bakı</city><active>true</active></customer>'
        '304':
          description: Dəyişiklik yoxdur (If-None-Match ETag ilə üst-üstə düşdü)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '404': { $ref: '#/components/responses/CustomerNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
