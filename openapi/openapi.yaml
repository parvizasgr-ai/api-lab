                lesson: 1
                title: Dərs 1 — API əsasları
                description: null
                kind: SLIDES
                originalFilename: API_Ders1_Giris.pdf
                mime: application/pdf
                sizeBytes: 2481920
                pageCount: null
                status: UPLOADED
                errorMessage: null
                uploadedBy: admin
                sortOrder: 0
                createdAt: '2026-10-13T09:00:00Z'
                updatedAt: '2026-10-13T09:00:00Z'
                links: { self: /api/v1/materials/4, pages: /api/v1/materials/4/pages, download: '/api/v1/materials/4/download?exp=1792144800&sig=3f1c0b5e8a9d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b', pdf: null, thumbnail: null }
