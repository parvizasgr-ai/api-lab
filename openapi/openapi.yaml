# ============================================================================
# COMPONENTS
# ============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`POST /api/v1/auth/login` cavabındakı `access_token`. Başlıq: `Authorization: Bearer <token>`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Demo açar: `apilab-demo-key-2026`.'
    basicAuth:
      type: http
      scheme: basic
      description: '`Authorization: Basic base64(username:password)` — yalnız `/api/v1/auth/basic-demo`.'
    googleOAuth:
      type: oauth2
      description: Mock "Google" Authorization Server (lokal). Client — `apilab-portal` / `apilab-portal-secret`.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:3000/oauth/authorize
          tokenUrl: http://localhost:3000/oauth/token
          scopes:
            openid: İstifadəçi identifikatoru
            profile: Ad, şəkil
            email: Email ünvanı
            accounts:read: Hesabları oxumaq
            cards:read: Kartları oxumaq

  parameters:
    Page:
      name: page
      in: query
      description: Səhifə nömrəsi (1-dən)
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    Size:
      name: size
      in: query
      description: Səhifə ölçüsü (maks. 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AccountId:
      name: accountId
      in: path
      required: true
      description: Hesab nömrəsi
      schema: { $ref: '#/components/schemas/AccountId' }
      example: AZ21NABZ0001
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    HotelId:
      name: hotelId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 12
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    MaterialId:
      name: materialId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    PageNo:
      name: pageNo
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 10000 }
      example: 1
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    SignedExp:
      name: exp
      in: query
      required: false
      description: Pre-signed URL-in bitmə vaxtı (Unix epoch saniyə)
      schema: { type: integer, minimum: 0 }
    SignedSig:
      name: sig
      in: query
      required: false
      description: 'HMAC-SHA256(path + ":" + exp) — server sirri ilə'
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    RapidApiKey:
      name: X-RapidAPI-Key
      in: header
      required: false
      description: |
        Sizin şəxsi RapidAPI açarınız (rapidapi.com → Apps → Authorization). Server onu **yalnız upstream-ə ötürür** —
        DB-də, loglarda və `/_history`-də saxlanmır. Yoxdursa → 503 `EXTERNAL_KEY_MISSING` (server key standart olaraq söndürülüb).
      schema: { type: string, minLength: 20, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
      example: your-own-rapidapi-key-here-0000000000
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Unikal açar (8–64 simvol, məs. UUID). Eyni açarla təkrar sorğu → saxlanmış cavab (24 saat).'
      schema: { $ref: '#/components/schemas/IdempotencyKey' }
      example: 6f1c2d3e-block-card-1
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 'MƏCBURİ. Unikal açar (8–64 simvol, məs. UUID). Şəbəkə xətasından sonra eyni açarla təkrar göndərmək təhlükəsizdir.'
      schema:
        allOf:
          - { $ref: '#/components/schemas/IdempotencyKey' }
        x-error-code: IDEMPOTENCY_KEY_REQUIRED
      example: 9b2e7c1a-transfer-0001
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Əvvəlki cavabın `ETag` dəyəri
      schema: { type: string, maxLength: 100 }
      example: '"c1-2026-04-06T09:13:00Z"'
    OAuthResponseType:
      name: response_type
      in: query
      required: true
      schema: { type: string, enum: [code] }
    OAuthClientId:
      name: client_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
      example: apilab-portal
    OAuthRedirectUri:
      name: redirect_uri
      in: query
      required: true
      schema: { type: string, format: uri, maxLength: 500 }
      example: http://localhost:5173/oauth/callback
    OAuthScope:
      name: scope
      in: query
      required: false
      description: Boşluqla ayrılmış scope-lar
      schema: { $ref: '#/components/schemas/ScopeString' }
      example: openid profile email
    OAuthState:
      name: state
      in: query
      required: true
      description: CSRF qoruması üçün client-in yaratdığı təsadüfi dəyər (min. 8 simvol)
      schema: { type: string, minLength: 8, maxLength: 200 }
      example: xyz-12345678

  headers:
    X-Request-Id:
      description: Sorğunun unikal identifikatoru (xətada `traceId` ilə eyni)
      schema: { type: string }
      example: req_7f2c9a
    X-RateLimit-Limit:
      description: Dəqiqədə icazə verilən sorğu sayı
      schema: { type: integer }
      example: 60
    X-RateLimit-Remaining:
      description: Cari pəncərədə qalan sorğu sayı
      schema: { type: integer }
      example: 57
    X-RateLimit-Reset:
      description: Pəncərənin sıfırlanma vaxtı (Unix epoch saniyə)
      schema: { type: integer }
      example: 1792141260
    X-Cache:
      description: 'External proxy cache-i: HIT (60 san ərzində eyni sorğu) və ya MISS'
      schema: { type: string, enum: [HIT, MISS] }
      example: MISS
    X-External-Key-Source:
      description: 'Hansı açar istifadə olundu: student (sizin X-RapidAPI-Key) və ya server (admin açıbsa, yalnız Hard Limit API)'
      schema: { type: string, enum: [student, server] }
      example: student
    Retry-After:
      description: Neçə saniyədən sonra yenidən cəhd etmək olar
      schema: { type: integer }
      example: 42
    Location:
      description: Yaradılmış resursun URL-i
      schema: { type: string }
      example: /api/v1/customers/26
    ETag:
      description: Resurs versiyasının identifikatoru (dəyişəndə dəyişir)
      schema: { type: string }
      example: '"c1-2026-04-06T09:13:00Z"'
    Idempotent-Replayed:
      description: '`true` — cavab Idempotency-Key ilə saxlanmış nəticədən təkrar qaytarılıb, əməliyyat yenidən icra olunmayıb'
      schema: { type: string, enum: ['true'] }
    Deprecation:
      description: Bu versiya köhnəlib (RFC 9745)
      schema: { type: string }
      example: '@1798761600'
    Sunset:
      description: Bu versiyanın söndürüləcəyi tarix (RFC 8594)
      schema: { type: string }
      example: Thu, 31 Dec 2026 23:59:59 GMT
    LinkSuccessor:
      description: Yeni versiyaya keçid
      schema: { type: string }
      example: '</api/v2/customers>; rel="successor-version"'
    Allow:
      description: Dəstəklənən HTTP metodları
      schema: { type: string }
      example: GET, POST, HEAD, OPTIONS

  responses:
    BadRequest:
      description: Sorğu sintaktik olaraq səhvdir (məs. JSON parse olunmur)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 400, code: MALFORMED_JSON, message: Request body düzgün JSON deyil, details: [{ field: body, message: 'Unexpected token } in JSON at position 27' }], traceId: req_7f2c9a }
    Unauthorized:
      description: Token yoxdur, etibarsızdır və ya vaxtı keçib
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: Bearer realm="API Lab"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing: { summary: Token yoxdur, value: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: UNAUTHORIZED, message: Authorization başlığı yoxdur, details: [], traceId: req_7f2c9a } }
            expired: { summary: Token-in vaxtı keçib, value: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: TOKEN_EXPIRED, message: Access token-in vaxtı keçib — /auth/refresh istifadə edin, details: [], traceId: req_7f2c9a } }
            invalid: { summary: İmza səhvdir, value: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: INVALID_TOKEN, message: Token etibarsızdır, details: [], traceId: req_7f2c9a } }
    UnauthorizedApiKey:
      description: X-API-Key yoxdur və ya etibarsızdır
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing: { summary: Açar yoxdur, value: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: UNAUTHORIZED, message: X-API-Key başlığı yoxdur, details: [], traceId: req_7f2c9a } }
            invalid: { summary: Açar səhvdir / deaktivdir, value: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: INVALID_API_KEY, message: API key etibarsızdır və ya deaktiv edilib, details: [], traceId: req_7f2c9a } }
    Forbidden:
      description: Autentifikasiya var, amma icazə yoxdur (scope və ya rol)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            scope: { summary: Scope çatışmır, value: { timestamp: '2026-10-13T09:00:00Z', status: 403, code: INSUFFICIENT_SCOPE, message: 'Bu əməliyyat üçün scope lazımdır: bookings:write', details: [{ field: scope, message: 'Tələb olunur: bookings:write' }], traceId: req_7f2c9a } }
            role: { summary: ADMIN deyil, value: { timestamp: '2026-10-13T09:00:00Z', status: 403, code: FORBIDDEN, message: Bu əməliyyat yalnız ADMIN üçündür, details: [], traceId: req_7f2c9a } }
    ForbiddenBola:
      description: Başqasının resursu (BOLA qorunması) və ya scope çatışmır
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            bola: { summary: Başqasının resursu, value: { timestamp: '2026-10-13T09:00:00Z', status: 403, code: FORBIDDEN, message: Bu resursa giriş icazəniz yoxdur, details: [], traceId: req_7f2c9a } }
            scope: { summary: Scope çatışmır, value: { timestamp: '2026-10-13T09:00:00Z', status: 403, code: INSUFFICIENT_SCOPE, message: Bu əməliyyat üçün əlavə scope lazımdır, details: [], traceId: req_7f2c9a } }
    ValidationError:
      description: Sorğu OpenAPI sxeminə uyğun deyil (bilinməyən sahə, səhv tip, enum, pattern, min/max, required)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            required: { summary: Məcburi sahə yoxdur, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: VALIDATION_ERROR, message: Sorğu sxemə uyğun deyil, details: [{ field: /email, message: must have required property 'email' }], traceId: req_7f2c9a } }
            unknownField: { summary: Bilinməyən sahə, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: VALIDATION_ERROR, message: Sorğu sxemə uyğun deyil, details: [{ field: /age, message: must NOT have additional properties }], traceId: req_7f2c9a } }
            type: { summary: Səhv tip, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: VALIDATION_ERROR, message: Sorğu sxemə uyğun deyil, details: [{ field: query page, message: must be integer }], traceId: req_7f2c9a } }
    UnsupportedMediaType:
      description: Content-Type dəstəklənmir (məs. JSON əvəzinə text/plain)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 415, code: UNSUPPORTED_MEDIA_TYPE, message: 'Content-Type application/json olmalıdır', details: [{ field: Content-Type, message: 'Alındı: text/plain' }], traceId: req_7f2c9a }
    NotAcceptable:
      description: Accept başlığındakı format dəstəklənmir (yalnız application/json və application/xml)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 406, code: NOT_ACCEPTABLE, message: 'Dəstəklənən formatlar: application/json, application/xml', details: [], traceId: req_7f2c9a }
    ExternalPathRejected:
      description: Yol və ya parametr icazəli pattern-ə uyğun deyil (.., //, @, \, %2e, %2f, CR/LF) — SSRF qoruması
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 400, code: EXTERNAL_PATH_REJECTED, message: 'Yol icazəsiz simvollar daşıyır', details: [{ field: path, message: Proxy yalnız kataloqdakı path pattern-lərini qəbul edir }], traceId: req_7f2c9a }
    ExternalNotFound:
      description: API kataloqda aktiv deyil (verified false)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: EXTERNAL_API_NOT_FOUND, message: 'Bu external API kataloqda aktiv deyil (verified: false)', details: [], traceId: req_7f2c9a }
    ExternalBadGateway:
      description: Upstream (RapidAPI) xətası — abunə yoxdur, açar etibarsızdır, limit bitib (Retry-After ilə), 5xx və ya cavab çox böyükdür
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notSubscribed: { summary: Abunə yoxdur, value: { timestamp: '2026-10-13T09:00:00Z', status: 502, code: EXTERNAL_NOT_SUBSCRIBED, message: Bu API-yə abunə deyilsiniz, details: [{ field: upstream, message: 'HTTP 403: You are not subscribed to this API.' }], traceId: req_7f2c9a } }
            rateLimited: { summary: Limit bitib, value: { timestamp: '2026-10-13T09:00:00Z', status: 502, code: EXTERNAL_RATE_LIMITED, message: RapidAPI limiti bitib — 60 saniyə sonra yenidən cəhd edin, details: [{ field: upstream, message: HTTP 429 }], traceId: req_7f2c9a } }
            upstream: { summary: Upstream 5xx, value: { timestamp: '2026-10-13T09:00:00Z', status: 502, code: EXTERNAL_UPSTREAM_ERROR, message: Upstream xətası (HTTP 503), details: [{ field: upstream, message: HTTP 503 }], traceId: req_7f2c9a } }
    ExternalKeyMissing:
      description: RapidAPI key yoxdur (X-RapidAPI-Key göndərilməyib, server key söndürülüb)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 503, code: EXTERNAL_KEY_MISSING, message: RapidAPI key yoxdur — öz açarınızı X-RapidAPI-Key başlığı ilə göndərin, details: [{ field: header X-RapidAPI-Key, message: Server key söndürülüb (standart rejim) }], traceId: req_7f2c9a }
    ExternalTimeout:
      description: Upstream 8 saniyədə cavab vermədi
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 504, code: EXTERNAL_TIMEOUT, message: Upstream 8 saniyədə cavab vermədi, details: [], traceId: req_7f2c9a }
    TooManyRequests:
      description: Rate limit keçildi (60 sorğu/dəqiqə)
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
        X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/X-RateLimit-Reset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 429, code: TOO_MANY_REQUESTS, message: Çox sayda sorğu — 42 saniyə sonra yenidən cəhd edin, details: [], traceId: req_7f2c9a }
    InternalError:
      description: Gözlənilməz server xətası (stack trace qaytarılmır; `X-Simulate` ilə də yaradıla bilər)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            internal: { summary: Server xətası, value: { timestamp: '2026-10-13T09:00:00Z', status: 500, code: INTERNAL_ERROR, message: Gözlənilməz xəta baş verdi. traceId ilə dəstəyə müraciət edin, details: [], traceId: req_7f2c9a } }
            simulated: { summary: 'X-Simulate: 500', value: { timestamp: '2026-10-13T09:00:00Z', status: 500, code: SIMULATED_ERROR, message: 'X-Simulate: 500 ilə yaradılmış test xətası', details: [], traceId: req_7f2c9a } }
    PayloadTooLarge:
      description: Fayl çox böyükdür (maks. 50 MB)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 413, code: PAYLOAD_TOO_LARGE, message: Fayl çox böyükdür — maksimum 50 MB, details: [], traceId: req_7f2c9a }
    BodyTooLarge:
      description: JSON / form body 100 KB limitini aşır
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 413, code: PAYLOAD_TOO_LARGE, message: Request body çox böyükdür (maks. 100 KB), details: [], traceId: req_7f2c9a }
    UnauthorizedSigned:
      description: Nə Bearer token, nə də etibarlı pre-signed imza (exp/sig) var
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            missing: { summary: Token və imza yoxdur, value: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: UNAUTHORIZED, message: 'Bearer token və ya pre-signed URL (exp, sig) tələb olunur', details: [], traceId: req_7f2c9a } }
            expired: { summary: İmzanın vaxtı keçib, value: { timestamp: '2026-10-13T09:00:00Z', status: 401, code: INVALID_SIGNATURE, message: Pre-signed URL etibarsızdır və ya vaxtı keçib, details: [], traceId: req_7f2c9a } }
    MaterialNotFound:
      description: Material tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: MATERIAL_NOT_FOUND, message: Material tapılmadı, details: [], traceId: req_7f2c9a }
    PageNotFound:
      description: Material və ya səhifə tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: PAGE_NOT_FOUND, message: Səhifə tapılmadı, details: [], traceId: req_7f2c9a }
    MaterialBusy:
      description: Material hazırda konvertasiya olunur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 409, code: MATERIAL_BUSY, message: Material hazırda konvertasiya olunur — bitməsini gözləyin, details: [], traceId: req_7f2c9a }
    TaskNotFound:
      description: Tapşırıq tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: TASK_NOT_FOUND, message: Tapşırıq tapılmadı, details: [], traceId: req_7f2c9a }
    TaskExists:
      description: Bu dərsdə eyni başlıqlı tapşırıq var (UNIQUE lesson + title)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 409, code: TASK_EXISTS, message: Bu dərsdə eyni başlıqlı tapşırıq artıq var, details: [], traceId: req_7f2c9a }
    CardNotFound:
      description: Kart tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: CARD_NOT_FOUND, message: Kart tapılmadı, details: [], traceId: req_7f2c9a }
    RateNotFound:
      description: Bu tarix/valyuta üçün məzənnə yoxdur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: RATE_NOT_FOUND, message: Bu tarix üçün məzənnə tapılmadı, details: [], traceId: req_7f2c9a }
    FlightNotFound:
      description: Reys tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: FLIGHT_NOT_FOUND, message: Reys tapılmadı, details: [], traceId: req_7f2c9a }
    BookingNotFound:
      description: Bron tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: BOOKING_NOT_FOUND, message: Bron tapılmadı, details: [], traceId: req_7f2c9a }
    BookingAlreadyCancelled:
      description: Bron artıq ləğv edilib
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 409, code: BOOKING_ALREADY_CANCELLED, message: Bron artıq ləğv edilib, details: [], traceId: req_7f2c9a }
    HotelNotFound:
      description: Otel tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: HOTEL_NOT_FOUND, message: Otel tapılmadı, details: [], traceId: req_7f2c9a }
    RoomNotAvailable:
      description: Otaq bu tarixlərdə doludur (tarix kəsişməsi)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 409, code: ROOM_NOT_AVAILABLE, message: Otaq seçilmiş tarixlərdə doludur, details: [{ field: checkIn, message: 'Kəsişən bron: #1 (2026-10-18 – 2026-10-21)' }], traceId: req_7f2c9a }
    HotelBookingInvalid:
      description: Tarix aralığı, tutum və ya validation xətası
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            dateRange: { summary: checkOut ≤ checkIn və ya keçmiş tarix, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: INVALID_DATE_RANGE, message: checkIn bu gündən sonra və checkOut checkIn-dən sonra olmalıdır, details: [], traceId: req_7f2c9a } }
            capacity: { summary: Qonaq sayı otaq tutumundan çoxdur, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: ROOM_CAPACITY_EXCEEDED, message: 'Otaq tutumu: 1, qonaq: 2', details: [], traceId: req_7f2c9a } }
            validation: { summary: Bilinməyən sahə, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: VALIDATION_ERROR, message: Sorğu sxemə uyğun deyil, details: [{ field: /breakfast, message: must NOT have additional properties }], traceId: req_7f2c9a } }
    CustomerNotFound:
      description: Müştəri tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: CUSTOMER_NOT_FOUND, message: Müştəri tapılmadı, details: [], traceId: req_7f2c9a }
    EmailExists:
      description: Bu email artıq istifadə olunur (UNIQUE constraint)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 409, code: EMAIL_EXISTS, message: Bu email artıq qeydiyyatdadır, details: [{ field: email, message: nigar.aliyeva@example.az }], traceId: req_7f2c9a }
    BookNotFound:
      description: Kitab tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: BOOK_NOT_FOUND, message: Kitab tapılmadı, details: [], traceId: req_7f2c9a }
    TrackNotFound:
      description: Trek tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: TRACK_NOT_FOUND, message: Trek tapılmadı, details: [], traceId: req_7f2c9a }
    PlaylistNotFound:
      description: Playlist tapılmadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { timestamp: '2026-10-13T09:00:00Z', status: 404, code: PLAYLIST_NOT_FOUND, message: Playlist tapılmadı, details: [], traceId: req_7f2c9a }

  schemas:
    # ---------------------------------------------------------------- common
    Error:
      type: object
      description: Vahid xəta formatı — bütün 4xx/5xx cavablar (OAuth token endpoint istisnadır).
      required: [timestamp, status, code, message, details, traceId]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: İnsan üçün izah (Azərbaycan dilində) }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
        traceId: { type: string, description: '`X-Request-Id` ilə eynidir — loglarda axtarış üçün' }
    ExternalJson:
      type: object
      description: Upstream JSON cavabı — proxy dəyişdirmir (yalnız açar əks olunubsa *** ilə əvəzlənir)
      additionalProperties: true
    ExternalTranslateRequest:
      type: object
      additionalProperties: false
      required: [q, source, target]
      properties:
        q: { type: string, minLength: 1, maxLength: 500 }
        source: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        target: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
    Localized:
      type: object
      additionalProperties: false
      required: [az, en]
      properties:
        az: { type: string }
        en: { type: string }
    ExternalCatalog:
      type: object
      additionalProperties: false
      required: [items, serverKeyEnabled]
      properties:
        serverKeyEnabled: { type: boolean }
        unverified: { type: array, items: { type: string }, description: Yalnız ADMIN üçün }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, host, rapidApiUrl, description, freeLimit, hardLimit, verified, serverKeyAvailable, endpoints]
            properties:
              id: { type: string }
              name: { type: string }
              host: { type: string }
              rapidApiUrl: { type: string, format: uri }
              description: { $ref: '#/components/schemas/Localized' }
              freeLimit: { $ref: '#/components/schemas/Localized' }
              hardLimit: { type: boolean }
              verified: { type: boolean }
              serverKeyAvailable: { type: boolean }
              endpoints:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [operationId, method, path, produces, summary, example]
                  properties:
                    operationId: { type: string }
                    method: { type: string, enum: [GET, POST] }
                    path: { type: string }
                    produces: { type: string, enum: [json, image] }
                    summary: { $ref: '#/components/schemas/Localized' }
                    example:
                      type: object
                      additionalProperties: false
                      required: [path]
                      properties:
                        path: { type: string }
                        query: { type: object, additionalProperties: { type: string } }
                        body: { type: object, additionalProperties: true }
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: 'JSON Pointer (`/email`), `query <ad>`, `header <ad>` və ya sahə adı' }
        message: { type: string }
    ErrorCode:
      type: string
      description: Maşın üçün sabit xəta kodu. Client məntiqi `message`-ə yox, `code`-a əsaslanmalıdır.
      enum:
        # 400
        - BAD_REQUEST
        - MALFORMED_JSON
        - INVALID_REDIRECT_URI
        - EXTERNAL_PATH_REJECTED
        - SQL_SYNTAX_ERROR
        # 401
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - INVALID_TOKEN
        - TOKEN_EXPIRED
        - INVALID_REFRESH_TOKEN
        - INVALID_API_KEY
        - INVALID_SIGNATURE
        # 403
        - FORBIDDEN
        - INSUFFICIENT_SCOPE
        # 404
        - NOT_FOUND
        - ROUTE_NOT_FOUND
        - USER_NOT_FOUND
        - ACCOUNT_NOT_FOUND
        - CARD_NOT_FOUND
        - TRANSFER_NOT_FOUND
        - RATE_NOT_FOUND
        - FLIGHT_NOT_FOUND
        - BOOKING_NOT_FOUND
        - HOTEL_NOT_FOUND
        - ROOM_NOT_FOUND
        - CUSTOMER_NOT_FOUND
        - BOOK_NOT_FOUND
        - TRACK_NOT_FOUND
        - PLAYLIST_NOT_FOUND
        - TRACK_NOT_IN_PLAYLIST
        - MATERIAL_NOT_FOUND
        - PAGE_NOT_FOUND
        - NO_PDF_VERSION
        - TASK_NOT_FOUND
        - EXTERNAL_API_NOT_FOUND
        # 405 / 406 / 415
        - METHOD_NOT_ALLOWED
        - NOT_ACCEPTABLE
        - UNSUPPORTED_MEDIA_TYPE
        # 409
        - CONFLICT
        - CARD_ALREADY_BLOCKED
        - CARD_NOT_BLOCKED
        - CARD_EXPIRED
        - SOLD_OUT
        - BOOKING_ALREADY_CANCELLED
        - ROOM_NOT_AVAILABLE
        - EMAIL_EXISTS
        - REVIEW_EXISTS
        - TRACK_ALREADY_IN_PLAYLIST
        - MATERIAL_BUSY
        - TASK_EXISTS
        # 413
        - PAYLOAD_TOO_LARGE
        # 422
        - VALIDATION_ERROR
        - INVALID_REASON
        - CARD_PERMANENTLY_BLOCKED
        - INSUFFICIENT_FUNDS
        - CURRENCY_MISMATCH
        - SAME_ACCOUNT
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - INVALID_DATE_RANGE
        - ROOM_CAPACITY_EXCEEDED
        - INVALID_CURSOR
        - SQL_NOT_ALLOWED
        - SQL_TIMEOUT
        - INVALID_TASK_FILE
        # 429
        - TOO_MANY_REQUESTS
        # 5xx
        - INTERNAL_ERROR
        - SIMULATED_ERROR
        - BAD_GATEWAY
        - SERVICE_UNAVAILABLE
        - GATEWAY_TIMEOUT
        - EXTERNAL_NOT_SUBSCRIBED
        - EXTERNAL_KEY_INVALID
        - EXTERNAL_RATE_LIMITED
        - EXTERNAL_UPSTREAM_ERROR
        - EXTERNAL_UNAVAILABLE
        - EXTERNAL_RESPONSE_TOO_LARGE
        - EXTERNAL_KEY_MISSING
        - EXTERNAL_TIMEOUT
    OAuthError:
      type: object
      description: RFC 6749 §5.2 xəta formatı (yalnız `POST /oauth/token`)
      required: [error]
      properties:
        error: { type: string, enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope] }
        error_description: { type: string }
    Money:
      type: number
      description: 'Pul məbləği (decimal, maks. 2 onluq). DB-də minor units (qəpik) INTEGER kimi saxlanılır: 125.50 ↔ 12550.'
      example: 125.50
    MoneyInput:
      type: number
      description: Request-də pul məbləği — müsbət, maksimum 2 onluq rəqəm.
      minimum: 0.01
      maximum: 1000000
      multipleOf: 0.01
      example: 25.00
    CurrencyCode:
      type: string
      description: ISO 4217 valyuta kodu
      enum: [AZN, USD, EUR, TRY, GBP, GEL, AED]
      example: AZN
    AirportCode:
      type: string
      description: IATA hava limanı kodu
      pattern: '^[A-Z]{3}$'
      example: GYD
    AccountId:
      type: string
      pattern: '^AZ[0-9]{2}[A-Z]{4}[0-9]{4}$'
      example: AZ21NABZ0001
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    ScopeString:
      type: string
      maxLength: 300
      pattern: '^[a-z:_]+( [a-z:_]+)*$'
    PageMeta:
      type: object
      required: [page, size, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    # ---------------------------------------------------------------- auth
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-zA-Z0-9_.-]+$' }
        password: { type: string, minLength: 6, maxLength: 100, format: password }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 10, maxLength: 200 }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string, description: JWT (HS256) }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Saniyə (900 = 15 dəqiqə) }
        refresh_token: { type: string }
        scope: { type: string, description: Boşluqla ayrılmış scope-lar }
    User:
      type: object
      required: [id, username, fullName, email, role, scopes]
      properties:
        id: { type: integer }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [USER, ADMIN] }
        scopes: { type: array, items: { type: string } }
    BasicDemoResponse:
      type: object
      required: [authScheme, username, message]
      properties:
        authScheme: { type: string, enum: [Basic] }
        username: { type: string }
        message: { type: string }
        decodedHeader: { type: string, description: Decode olunmuş başlıq (parol maskalanıb) }
    OAuthConsentForm:
      type: object
      additionalProperties: false
      required: [client_id, redirect_uri, state, username, decision]
      properties:
        client_id: { type: string, minLength: 1, maxLength: 100 }
        redirect_uri: { type: string, format: uri, maxLength: 500 }
        scope: { $ref: '#/components/schemas/ScopeString' }
        state: { type: string, minLength: 8, maxLength: 200 }
        username: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-zA-Z0-9_.-]+$' }
        password: { type: string, maxLength: 100, description: 'decision=allow üçün məcburidir' }
        decision: { type: string, enum: [allow, deny] }
    OAuthConsentInfo:
      type: object
      required: [client, redirectUri, scope, state, accounts]
      properties:
        client:
          type: object
          required: [clientId, name]
          properties:
            clientId: { type: string }
            name: { type: string }
        redirectUri: { type: string }
        scope: { type: string }
        state: { type: string }
        accounts:
          type: array
          items:
            type: object
            required: [username, fullName, email]
            properties:
              username: { type: string }
              fullName: { type: string }
              email: { type: string }
    OAuthRedirect:
      type: object
      required: [location]
      properties:
        location: { type: string }
    OAuthTokenForm:
      type: object
      additionalProperties: false
      required: [grant_type, code, redirect_uri]
      properties:
        grant_type: { type: string, enum: [authorization_code] }
        code: { type: string, minLength: 1, maxLength: 200 }
        redirect_uri: { type: string, format: uri, maxLength: 500 }
        client_id: { type: string, maxLength: 100, description: Basic Auth istifadə olunmursa məcburidir }
        client_secret: { type: string, maxLength: 200, description: Basic Auth istifadə olunmursa məcburidir }
    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string, description: 'POST /api/v1/auth/refresh ilə yenilənir; scope genişlənmir' }
        scope: { type: string }
    UserInfo:
      type: object
      required: [sub, name, email]
      properties:
        sub: { type: string }
        name: { type: string }
        preferred_username: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        picture: { type: string, format: uri }

    # ---------------------------------------------------------------- bank
    Account:
      type: object
      required: [id, type, currency, balance, openedAt]
      properties:
        id: { $ref: '#/components/schemas/AccountId' }
        type: { type: string, enum: [CURRENT, SAVINGS] }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        balance: { $ref: '#/components/schemas/Money' }
        openedAt: { type: string, format: date-time }
    AccountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
    Transaction:
      type: object
      required: [id, accountId, type, amount, currency, description, transferId, createdAt]
      properties:
        id: { type: integer }
        accountId: { $ref: '#/components/schemas/AccountId' }
        type: { type: string, enum: [DEBIT, CREDIT] }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        description: { type: string }
        transferId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    TransactionPage:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
    Card:
      type: object
      required: [id, accountId, maskedNumber, last4, brand, status, statusReason, dailyLimit, currency, expiresAt]
      properties:
        id: { type: integer }
        accountId: { $ref: '#/components/schemas/AccountId' }
        maskedNumber: { type: string, example: '**** **** **** 4169' }
        last4: { type: string, pattern: '^[0-9]{4}$' }
        brand: { type: string, enum: [VISA, MASTERCARD] }
        status: { type: string, enum: [ACTIVE, BLOCKED, EXPIRED] }
        statusReason: { type: string, nullable: true, enum: [LOST, STOLEN, SUSPECTED_FRAUD, null] }
        dailyLimit: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        expiresAt: { type: string, format: date }
    CardList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Card' } }
    CardStatusHistoryEntry:
      type: object
      required: [oldStatus, newStatus, reason, changedBy, changedAt]
      properties:
        oldStatus: { type: string }
        newStatus: { type: string }
        reason: { type: string, nullable: true }
        changedBy: { type: string, nullable: true, description: 'username; null — sistem' }
        changedAt: { type: string, format: date-time }
    CardDetail:
      allOf:
        - { $ref: '#/components/schemas/Card' }
        - type: object
          required: [statusHistory]
          properties:
            statusHistory: { type: array, items: { $ref: '#/components/schemas/CardStatusHistoryEntry' } }
    BlockCardRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          description: '`STOLEN` — daimi blok (unblock mümkün deyil)'
          enum: [LOST, STOLEN, SUSPECTED_FRAUD]
          x-error-code: INVALID_REASON
        comment: { type: string, maxLength: 500 }
    UnblockCardRequest:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 500 }
    CardStatusChangeResponse:
      type: object
      required: [cardId, previousStatus, status, reason, changedAt, message]
      properties:
        cardId: { type: integer }
        previousStatus: { type: string, enum: [ACTIVE, BLOCKED, EXPIRED] }
        status: { type: string, enum: [ACTIVE, BLOCKED, EXPIRED] }
        reason: { type: string, nullable: true }
        comment: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }
        message: { type: string }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [fromAccountId, toAccountId, amount, currency]
      properties:
        fromAccountId: { $ref: '#/components/schemas/AccountId' }
        toAccountId: { $ref: '#/components/schemas/AccountId' }
        amount: { $ref: '#/components/schemas/MoneyInput' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    Transfer:
      type: object
      required: [id, fromAccountId, toAccountId, amount, currency, status, createdAt]
      properties:
        id: { type: integer }
        fromAccountId: { $ref: '#/components/schemas/AccountId' }
        toAccountId: { $ref: '#/components/schemas/AccountId' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- currencies
    Currency:
      type: object
      required: [code, name, symbol]
      properties:
        code: { $ref: '#/components/schemas/CurrencyCode' }
        name: { type: string }
        symbol: { type: string }
    CurrencyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Currency' } }
    RatesResponse:
      type: object
      required: [base, date, rates]
      properties:
        base: { $ref: '#/components/schemas/CurrencyCode' }
        date: { type: string, format: date }
        rates:
          type: object
          description: '1 base = X quote'
          additionalProperties: { type: number }
    ConvertResponse:
      type: object
      required: [from, to, amount, rate, result, date]
      properties:
        from: { $ref: '#/components/schemas/CurrencyCode' }
        to: { $ref: '#/components/schemas/CurrencyCode' }
        amount: { $ref: '#/components/schemas/Money' }
        rate: { type: number }
        result: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
    RateHistoryResponse:
      type: object
      required: [from, to, days, points]
      properties:
        from: { $ref: '#/components/schemas/CurrencyCode' }
        to: { $ref: '#/components/schemas/CurrencyCode' }
        days: { type: integer }
        points:
          type: array
          items:
            type: object
            required: [date, rate]
            properties:
              date: { type: string, format: date }
              rate: { type: number }

    # ---------------------------------------------------------------- flights
    Airport:
      type: object
      required: [code, city, country, name]
      properties:
        code: { $ref: '#/components/schemas/AirportCode' }
        city: { type: string }
        country: { type: string }
        name: { type: string }
    AirportList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Airport' } }
    Flight:
      type: object
      required: [id, flightNo, airline, from, to, departAt, arriveAt, durationMin, stops, price, currency, seatsLeft]
      properties:
        id: { type: integer }
        flightNo: { type: string }
        airline:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
        from: { $ref: '#/components/schemas/FlightPoint' }
        to: { $ref: '#/components/schemas/FlightPoint' }
        departAt: { type: string, format: date-time }
        arriveAt: { type: string, format: date-time }
        durationMin: { type: integer }
        stops: { type: integer }
        price: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        seatsLeft: { type: integer, minimum: 0 }
    FlightPoint:
      type: object
      required: [code, city]
      properties:
        code: { $ref: '#/components/schemas/AirportCode' }
        city: { type: string }
    FlightPage:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Flight' } }
    PassengerInput:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 50 }
        lastName: { type: string, minLength: 1, maxLength: 50 }
        passportNo:
          type: string
          description: Serverdə maskalanır (`C****4821`), açıq halda saxlanmır
          pattern: '^[A-Z]{1,2}[0-9]{6,8}$'
    Passenger:
      type: object
      required: [firstName, lastName, passportNoMasked]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        passportNoMasked: { type: string, nullable: true }
    FlightBookingRequest:
      type: object
      additionalProperties: false
      required: [flightId, passengers]
      properties:
        flightId: { type: integer, minimum: 1 }
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          items: { $ref: '#/components/schemas/PassengerInput' }
    FlightBooking:
      type: object
      required: [id, flightId, flightNo, route, departAt, status, passengers, total, currency, createdAt]
      properties:
        id: { type: integer }
        flightId: { type: integer }
        flightNo: { type: string }
        route: { type: string }
        departAt: { type: string, format: date-time }
        status: { type: string, enum: [CONFIRMED, CANCELLED] }
        passengers: { type: array, items: { $ref: '#/components/schemas/Passenger' } }
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        createdAt: { type: string, format: date-time }
    FlightBookingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FlightBooking' } }

    # ---------------------------------------------------------------- hotels
    HotelSummary:
      type: object
      required: [id, name, city, stars, rating, pricePerNightFrom, currency, pricePerNightFromAzn, amenities]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        stars: { type: integer, minimum: 1, maximum: 5 }
        rating: { type: number }
        pricePerNightFrom: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        pricePerNightFromAzn: { $ref: '#/components/schemas/Money' }
        amenities: { type: array, items: { type: string } }
        availableRooms: { type: integer, description: 'Yalnız checkIn/checkOut verildikdə' }
    HotelPage:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/HotelSummary' } }
    HotelDetail:
      allOf:
        - { $ref: '#/components/schemas/HotelSummary' }
        - type: object
          required: [description, roomCount]
          properties:
            description: { type: string }
            roomCount: { type: integer }
    Room:
      type: object
      required: [id, hotelId, roomType, capacity, pricePerNight, currency]
      properties:
        id: { type: integer }
        hotelId: { type: integer }
        roomType: { type: string, enum: [SINGLE, DOUBLE, SUITE, FAMILY] }
        capacity: { type: integer }
        pricePerNight: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        available: { type: boolean, description: 'Yalnız checkIn/checkOut verildikdə' }
    RoomList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Room' } }
    HotelBookingRequest:
      type: object
      additionalProperties: false
      required: [roomId, checkIn, checkOut, guests]
      properties:
        roomId: { type: integer, minimum: 1 }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests: { type: integer, minimum: 1, maximum: 6 }
    HotelBookingPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests: { type: integer, minimum: 1, maximum: 6 }
    HotelBooking:
      type: object
      required: [id, roomId, hotelId, hotelName, roomType, checkIn, checkOut, nights, guests, status, total, currency, createdAt, updatedAt]
      properties:
        id: { type: integer }
        roomId: { type: integer }
        hotelId: { type: integer }
        hotelName: { type: string }
        roomType: { type: string, enum: [SINGLE, DOUBLE, SUITE, FAMILY] }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: integer }
        guests: { type: integer }
        status: { type: string, enum: [CONFIRMED, CANCELLED] }
        total: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HotelBookingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HotelBooking' } }

    # ---------------------------------------------------------------- customers
    PersonName:
      type: string
      minLength: 1
      maxLength: 50
      pattern: "^[A-Za-zÀ-ÖØ-öø-ÿĞğİıŞşƏə][A-Za-zÀ-ÖØ-öø-ÿĞğİıŞşƏə '.-]*$"
    Phone:
      type: string
      description: Azərbaycan mobil nömrəsi, E.164 formatında
      pattern: '^\+994(10|50|51|55|60|70|77|99)[0-9]{7}$'
      example: '+994501234567'
    Customer:
      type: object
      xml: { name: customer }
      required: [id, firstName, lastName, email, phone, city, active, createdAt, updatedAt]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        city: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerCreate:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email]
      properties:
        firstName: { $ref: '#/components/schemas/PersonName' }
        lastName: { $ref: '#/components/schemas/PersonName' }
        email: { type: string, format: email, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        city: { type: string, minLength: 1, maxLength: 50 }
        active: { type: boolean, default: true }
    CustomerReplace:
      type: object
      additionalProperties: false
      description: PUT — bütün sahələr məcburidir (resurs tam əvəz olunur). `phone`/`city` üçün `null` = "yoxdur" (GET cavabı olduğu kimi geri göndərilə bilər).
      required: [firstName, lastName, email, phone, city, active]
      properties:
        firstName: { $ref: '#/components/schemas/PersonName' }
        lastName: { $ref: '#/components/schemas/PersonName' }
        email: { type: string, format: email, maxLength: 100 }
        phone: { type: string, nullable: true, description: 'E.164 (+994...) və ya null', pattern: '^\+994(10|50|51|55|60|70|77|99)[0-9]{7}$', example: '+994501234567' }
        city: { type: string, nullable: true, minLength: 1, maxLength: 50 }
        active: { type: boolean }
    CustomerPatch:
      type: object
      additionalProperties: false
      description: PATCH — ən azı 1 sahə. `phone`/`city` üçün `null` dəyəri silir.
      minProperties: 1
      properties:
        firstName: { $ref: '#/components/schemas/PersonName' }
        lastName: { $ref: '#/components/schemas/PersonName' }
        email: { type: string, format: email, maxLength: 100 }
        phone: { type: string, nullable: true, description: 'E.164 (+994...) və ya null (silmək)', pattern: '^\+994(10|50|51|55|60|70|77|99)[0-9]{7}$', example: '+994501234567' }
        city: { type: string, nullable: true, minLength: 1, maxLength: 50 }
        active: { type: boolean }
    CustomerPage:
      xml: { name: customerPage }
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              xml: { wrapped: true }
              items: { $ref: '#/components/schemas/Customer' }
    CustomerV2:
      type: object
      required: [id, fullName, email, phone, city, active, createdAt, updatedAt]
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        city: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerV2Page:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/CustomerV2' } }

    # ---------------------------------------------------------------- books
    Book:
      type: object
      required: [id, title, author, genre, year, description, rating, pages]
      properties:
        id: { type: integer }
        title: { type: string }
        author: { type: string }
        genre: { type: string }
        year: { type: integer, nullable: true }
        description: { type: string }
        rating: { type: number }
        pages: { type: integer }
    BookPage:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Book' } }
    BookCursorPage:
      type: object
      required: [items, limit, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Book' } }
        limit: { type: integer }
        nextCursor: { type: string, nullable: true, description: 'null — son səhifə' }
    Review:
      type: object
      required: [id, bookId, author, rating, comment, createdAt]
      properties:
        id: { type: integer }
        bookId: { type: integer }
        author: { type: string, description: Rəy yazanın username-i }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ReviewList:
      type: object
      required: [items, averageRating]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        averageRating: { type: number, nullable: true }
    ReviewCreate:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 1, maxLength: 1000 }

    # ---------------------------------------------------------------- music
    Track:
      type: object
      required: [id, youtubeId, title, artist, genre, durationSec, thumbnailUrl]
      properties:
        id: { type: integer }
        youtubeId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        title: { type: string }
        artist: { type: string }
        genre: { type: string }
        durationSec: { type: integer }
        thumbnailUrl: { type: string, format: uri }
    TrackPage:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items, source]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Track' } }
            source: { type: string, enum: [db, youtube] }
    PopularTrack:
      allOf:
        - { $ref: '#/components/schemas/Track' }
        - type: object
          required: [playCount]
          properties:
            playCount: { type: integer }
    PlayResponse:
      type: object
      required: [trackId, youtubeId, embedUrl, startedAt]
      properties:
        trackId: { type: integer }
        youtubeId: { type: string }
        embedUrl: { type: string, format: uri }
        startedAt: { type: string, format: date-time }
    Playlist:
      type: object
      required: [id, name, createdAt, tracks]
      properties:
        id: { type: integer }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        tracks:
          type: array
          items:
            type: object
            required: [position, track]
            properties:
              position: { type: integer }
              track: { $ref: '#/components/schemas/Track' }
    PlaylistList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Playlist' } }
    PlaylistCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    PlaylistAddTrack:
      type: object
      additionalProperties: false
      required: [trackId]
      properties:
        trackId: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 1, maximum: 1000 }

    # ---------------------------------------------------------------- bff
    BffCall:
      type: object
      required: [name, status, durationMs]
      properties:
        name: { type: string, description: Daxili service funksiyası (məs. hotels.search) }
        status: { type: integer, description: 'Həmin çağırışın HTTP-ekvivalent statusu (200, 503, 504...)' }
        durationMs: { type: number }
    BffMeta:
      type: object
      required: [calls, totalMs, partial]
      properties:
        calls: { type: array, items: { $ref: '#/components/schemas/BffCall' } }
        totalMs: { type: number, description: 'Paralel çağırışlarda totalMs < calls[].durationMs cəmi' }
        partial: { type: boolean, description: 'true — ən azı bir bölmə xəta verib (207)' }
    BffSectionError:
      type: object
      required: [status, error]
      properties:
        status: { type: integer, minimum: 400 }
        error: { $ref: '#/components/schemas/Error' }
    BffFlightsSection:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { type: integer, enum: [200] }
            data:
              type: object
              required: [items, total]
              properties:
                items: { type: array, items: { $ref: '#/components/schemas/Flight' } }
                total: { type: integer }
        - { $ref: '#/components/schemas/BffSectionError' }
    BffHotelsSection:
      oneOf:
        - type: object
          required: [status, data]
          properties:
            status: { type: integer, enum: [200] }
            data:
              type: object
              required: [items, total]
              properties:
                items: { type: array, items: { $ref: '#/components/schemas/HotelSummary' } }
                total: { type: integer }
        - { $ref: '#/components/schemas/BffSectionError' }
    BffDashboard:
      type: object
      required: [user, accounts, cards, recentTransactions, rates, meta]
      properties:
        user:
          type: object
          required: [id, username, fullName]
          properties:
            id: { type: integer }
            username: { type: string }
            fullName: { type: string }
        accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }
        cards: { type: array, items: { $ref: '#/components/schemas/Card' } }
        recentTransactions: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Transaction' } }
        rates: { $ref: '#/components/schemas/RatesResponse' }
        meta: { $ref: '#/components/schemas/BffMeta' }
    BffTravel:
      type: object
      required: [flights, hotels, meta]
      properties:
        flights: { $ref: '#/components/schemas/BffFlightsSection' }
        hotels: { $ref: '#/components/schemas/BffHotelsSection' }
        meta: { $ref: '#/components/schemas/BffMeta' }
    BffMusicHome:
      type: object
      required: [popular, playlists, meta]
      properties:
        popular: { type: array, items: { $ref: '#/components/schemas/PopularTrack' } }
        playlists: { type: array, items: { $ref: '#/components/schemas/Playlist' } }
        meta: { $ref: '#/components/schemas/BffMeta' }

    # ---------------------------------------------------------------- sql playground
    DbSchema:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items:
            type: object
            required: [name, type, rowCount, columns, foreignKeys, indexes]
            properties:
              name: { type: string }
              type: { type: string, enum: [table, view] }
              rowCount: { type: integer, nullable: true, description: 'View-lar üçün null' }
              columns:
                type: array
                items:
                  type: object
                  required: [name, type, notNull, primaryKey, hidden]
                  properties:
                    name: { type: string }
                    type: { type: string }
                    notNull: { type: boolean }
                    primaryKey: { type: boolean }
                    hidden: { type: boolean, description: 'true — Playground-da dəyəri gizlidir (hash/sirr sütunları)' }
              foreignKeys:
                type: array
                items:
                  type: object
                  required: [column, refTable, refColumn]
                  properties:
                    column: { type: string }
                    refTable: { type: string }
                    refColumn: { type: string }
              indexes:
                type: array
                items:
                  type: object
                  required: [name, columns, unique]
                  properties:
                    name: { type: string }
                    columns: { type: array, items: { type: string } }
                    unique: { type: boolean }
    SqlQueryRequest:
      type: object
      additionalProperties: false
      required: [sql]
      properties:
        sql: { type: string, minLength: 1, maxLength: 5000 }
    SqlQueryResult:
      type: object
      required: [columns, rows, rowCount, truncated, durationMs, hiddenColumns, executedSql]
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        rowCount: { type: integer }
        truncated: { type: boolean, description: 'true — 200 sətir və ya 1 MB limiti tətbiq olundu' }
        durationMs: { type: number }
        hiddenColumns: { type: array, items: { type: string }, description: 'Nəticədən çıxarılmış gizli sütunlar (cədvəl.sütun)' }
        executedSql: { type: string, description: 'Real icra olunan SQL (LIMIT əlavə olunmuş və ya endirilmiş)' }

    # ---------------------------------------------------------------- materials
    MaterialKind:
      type: string
      enum: [SLIDES, DOCUMENT, TASKSHEET, OTHER]
    MaterialStatus:
      type: string
      enum: [UPLOADED, CONVERTING, READY, READY_NO_PREVIEW, FAILED]
    Material:
      type: object
      required: [id, lesson, title, description, kind, originalFilename, mime, sizeBytes, pageCount, status, errorMessage, uploadedBy, sortOrder, createdAt, updatedAt, links]
      properties:
        id: { type: integer }
        lesson: { type: integer, nullable: true, enum: [1, 2, 3, null] }
        title: { type: string }
        description: { type: string, nullable: true }
        kind: { $ref: '#/components/schemas/MaterialKind' }
        originalFilename: { type: string, description: Yüklənən faylın adı (yalnız göstərmək üçün) }
        mime: { type: string }
        sizeBytes: { type: integer }
        pageCount: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/MaterialStatus' }
        errorMessage: { type: string, nullable: true }
        uploadedBy: { type: string, nullable: true }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        links:
          type: object
          required: [self, pages, download, pdf, thumbnail]
          properties:
            self: { type: string }
            pages: { type: string }
            download: { type: string, description: Pre-signed (1 saat) }
            pdf: { type: string, nullable: true, description: 'Pre-signed; PDF versiyası yoxdursa null' }
            thumbnail: { type: string, nullable: true, description: 'Pre-signed; səhifə şəkilləri yoxdursa null' }
    MaterialList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Material' } }
    MaterialUpload:
      type: object
      additionalProperties: false
      required: [file, title]
      properties:
        file: { type: string, format: binary, description: 'pdf, pptx, docx, md — maks. 50 MB' }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        lesson: { type: integer, enum: [1, 2, 3] }
        kind: { $ref: '#/components/schemas/MaterialKind' }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    MaterialPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        lesson: { type: integer, nullable: true, enum: [1, 2, 3, null] }
        kind: { $ref: '#/components/schemas/MaterialKind' }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    MaterialPageList:
      type: object
      required: [materialId, status, items]
      properties:
        materialId: { type: integer }
        status: { $ref: '#/components/schemas/MaterialStatus' }
        items:
          type: array
          items:
            type: object
            required: [pageNo, imageUrl, thumbUrl]
            properties:
              pageNo: { type: integer }
              imageUrl: { type: string }
              thumbUrl: { type: string }

    # ---------------------------------------------------------------- tasks
    HttpMethodName:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
    Task:
      type: object
      required: [id, lesson, title, descriptionMd, method, path, expectedStatus, sqlCheck, materialId, sortOrder, done, doneAt]
      properties:
        id: { type: integer }
        lesson: { type: integer, enum: [1, 2, 3] }
        title: { type: string }
        descriptionMd: { type: string }
        method: { $ref: '#/components/schemas/HttpMethodName' }
        path: { type: string }
        expectedStatus: { type: integer }
        sqlCheck: { type: string, nullable: true }
        materialId: { type: integer, nullable: true }
        sortOrder: { type: integer }
        done: { type: boolean, description: Cari istifadəçi üçün }
        doneAt: { type: string, format: date-time, nullable: true }
    TaskList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
    TaskCreate:
      type: object
      additionalProperties: false
      required: [lesson, title, method, path, expectedStatus]
      properties:
        lesson: { type: integer, enum: [1, 2, 3] }
        title: { type: string, minLength: 1, maxLength: 200 }
        descriptionMd: { type: string, maxLength: 10000 }
        method: { $ref: '#/components/schemas/HttpMethodName' }
        path: { type: string, minLength: 1, maxLength: 500, pattern: '^/' }
        expectedStatus: { type: integer, minimum: 100, maximum: 599 }
        sqlCheck: { type: string, maxLength: 5000 }
        materialId: { type: integer, minimum: 1 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        lesson: { type: integer, enum: [1, 2, 3] }
        title: { type: string, minLength: 1, maxLength: 200 }
        descriptionMd: { type: string, maxLength: 10000 }
        method: { $ref: '#/components/schemas/HttpMethodName' }
        path: { type: string, minLength: 1, maxLength: 500, pattern: '^/' }
        expectedStatus: { type: integer, minimum: 100, maximum: 599 }
        sqlCheck: { type: string, maxLength: 5000, nullable: true }
        materialId: { type: integer, minimum: 1, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    TaskProgressUpdate:
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done: { type: boolean }
    TaskProgress:
      type: object
      required: [taskId, done, doneAt]
      properties:
        taskId: { type: integer }
        done: { type: boolean }
        doneAt: { type: string, format: date-time, nullable: true }
    MyProgress:
      type: object
      required: [total, done, byLesson, items]
      properties:
        total: { type: integer }
        done: { type: integer }
        byLesson:
          type: array
          items:
            type: object
            required: [lesson, total, done]
            properties:
              lesson: { type: integer }
              total: { type: integer }
              done: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/TaskProgress' } }
    TaskImportUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: { type: string, format: binary, description: Markdown (.md) faylı }
    TaskImportResult:
      type: object
      required: [created, updated, tasks]
      properties:
        created: { type: integer }
        updated: { type: integer }
        tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }

    # ---------------------------------------------------------------- admin / meta
    ResetResponse:
      type: object
      required: [message, resetAt, tables]
      properties:
        message: { type: string }
        resetAt: { type: string, format: date-time }
        tables:
          type: object
          description: Cədvəl → sətir sayı
          additionalProperties: { type: integer }
    RequestLogEntry:
      type: object
      required: [id, requestId, method, path, route, status, durationMs, createdAt]
      properties:
        id: { type: integer }
        requestId: { type: string }
        method: { type: string }
        path: { type: string }
        route: { type: string, nullable: true }
        status: { type: integer }
        durationMs: { type: integer }
        createdAt: { type: string, format: date-time }
    RequestLogList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RequestLogEntry' } }
    Health:
      type: object
      required: [status, db, version, uptimeSec]
      properties:
        status: { type: string, enum: [ok] }
        db: { type: string, enum: [ok] }
        version: { type: string }
        uptimeSec: { type: integer }
