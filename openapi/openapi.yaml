  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Müştərilər siyahısı (Safe + Idempotent)
      description: '`Accept: application/xml` göndərsəniz cavab XML olur. Dəstəklənməyən Accept (məs. `text/csv`) → **406**.'
      x-db-impact:
        reads: [customers]
        writes: []
      parameters:
        - name: city
          in: query
          schema: { type: string, minLength: 1, maxLength: 50 }
          example: Bakı
        - name: active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Ad, soyad və ya email üzrə axtarış
          schema: { type: string, minLength: 1, maxLength: 100 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: sort
          in: query
          schema: { type: string, enum: [id, -id, lastName, -lastName, city, -city, createdAt, -createdAt], default: id }
      responses:
        '200':
          description: Müştərilər
          headers:
            Deprecation: { $ref: '#/components/headers/Deprecation' }
            Sunset: { $ref: '#/components/headers/Sunset' }
            Link: { $ref: '#/components/headers/LinkSuccessor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
              example:
                items:
                  - { id: 1, firstName: Nigar, lastName: Əliyeva, email: nigar.aliyeva@example.az, phone: '+994501234501', city: Bakı, active: true, createdAt: '2026-04-06T09:13:00Z', updatedAt: '2026-04-06T09:13:00Z' }
                page: 1
                size: 20
                total: 25
                totalPages: 2
            application/xml:
              schema: { type: string, description: CustomerPage-in XML təqdimatı }
              example: '<customerPage><items><customer><id>1</id><firstName>Nigar</firstName><lastName>Əliyeva</lastName><email>nigar.aliyeva@example.az</email></customer></items><page>1</page><size>20</size><total>25</total><totalPages>2</totalPages></customerPage>'
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Yeni müştəri (Not safe, Not idempotent)
      description: 'Uğurda **201 Created** + `Location: /api/v1/customers/{id}`. Eyni email → **409 EMAIL_EXISTS**. Səhv nümunə üçün: `{"email": "rena-at-example", "age": 25}` → **422** (format + bilinməyən sahə).'
      x-db-impact:
        reads: [customers]
        writes: [INSERT customers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
            examples:
              ok: { summary: Düzgün sorğu, value: { firstName: Rəna, lastName: Quliyeva, email: rena.quliyeva@example.az, phone: '+994501112233', city: Gəncə } }
              duplicate: { summary: 'Mövcud email → 409', value: { firstName: Nigar, lastName: Əliyeva, email: nigar.aliyeva@example.az } }
      responses:
        '201':
          description: Müştəri yaradıldı
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
              example: { id: 26, firstName: Rəna, lastName: Quliyeva, email: rena.quliyeva@example.az, phone: '+994501112233', city: Gəncə, active: true, createdAt: '2026-10-13T09:40:00Z', updatedAt: '2026-10-13T09:40:00Z' }
        '409': { $ref: '#/components/responses/EmailExists' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    options:
      tags: [Customers]
      operationId: optionsCustomers
      summary: Dəstəklənən metodlar (OPTIONS)
      x-db-impact:
        reads: []
        writes: []
      responses:
        '204':
          description: '`Allow` başlığında metodlar'
          headers:
            Allow: { $ref: '#/components/headers/Allow' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/customers/{customerId}:
