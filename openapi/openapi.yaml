  /api/v1/_db/query:
    post:
      tags: [SQL Playground]
      operationId: dbQuery
      summary: SQL sorğusu icra et (YALNIZ SELECT / WITH ... SELECT)
      description: |
        Qorunma qatları:
        1. **Tokenizer** — şərhlər (`--`, `/* */`) və string-lər nəzərə alınır; yalnız **1 statement**, birinci açar söz `SELECT` və ya `WITH`;
           `INSERT, UPDATE, DELETE, REPLACE, DROP, ALTER, CREATE, ATTACH, DETACH, PRAGMA, VACUUM, REINDEX, ANALYZE, BEGIN, COMMIT, ROLLBACK, SAVEPOINT, RELEASE`
           açar sözləri (string daxilində deyilsə) → **422 SQL_NOT_ALLOWED**.
        2. **Read-only bağlantı** (`readonly: true`) — DB-nin surəti üzərində, ayrıca prosesdə.
        3. **LIMIT 200** — yoxdursa əlavə olunur, böyükdürsə 200-ə endirilir (`executedSql`-də görünür), `truncated: true`.
        4. **2 saniyə timeout** — proses dayandırılır → **422 SQL_TIMEOUT**. Nəticə ölçüsü maks. 1 MB.
        5. **Gizli sütunlar** (`password_hash`, `token_hash`, `key_hash`, `client_secret_hash`, `oauth_codes.code`) — surətdə dəyərlər `[hidden]` ilə əvəz olunub,
           birbaşa seçilən gizli sütunlar nəticədən çıxarılır və `hiddenColumns`-da göstərilir.
        6. Rate limit — bu endpoint üçün **20 sorğu/dəqiqə** (`x-rate-limit`). Hər sorğu `audit_log`-a yazılır.
      security:
        - {}
        - bearerAuth: []
      x-rate-limit: 20
      x-db-impact:
        reads: ['* (istənilən cədvəl/view, read-only surət)']
        writes: [INSERT audit_log]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SqlQueryRequest' }
            examples:
              select: { summary: Kart tarixçəsi, value: { sql: 'SELECT * FROM card_status_history ORDER BY changed_at DESC' } }
              drop: { summary: 'Bloklanır → 422', value: { sql: DROP TABLE cards } }
      responses:
        '200':
          description: Nəticə
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SqlQueryResult' }
              example:
                columns: [id, card_id, old_status, new_status, reason, changed_by, changed_at]
                rows: [{ id: 1, card_id: 3, old_status: ACTIVE, new_status: BLOCKED, reason: LOST, changed_by: 1, changed_at: '2026-10-01T20:00:00Z' }]
                rowCount: 1
                truncated: false
                durationMs: 1
                hiddenColumns: []
                executedSql: SELECT * FROM card_status_history ORDER BY changed_at DESC LIMIT 201
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '422':
          description: İcazəsiz, sintaksis xətalı və ya çox uzun sürən sorğu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notAllowed: { summary: SELECT deyil, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: SQL_NOT_ALLOWED, message: Yalnız SELECT sorğularına icazə verilir, details: [{ field: sql, message: 'Qadağan olunmuş açar söz: DROP' }], traceId: req_7f2c9a } }
                multiple: { summary: Bir neçə statement, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: SQL_NOT_ALLOWED, message: Yalnız 1 SQL statement göndərilə bilər, details: [], traceId: req_7f2c9a } }
                syntax: { summary: Sintaksis xətası, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: SQL_SYNTAX_ERROR, message: 'near "FORM": syntax error', details: [], traceId: req_7f2c9a } }
                timeout: { summary: 2 saniyədən çox, value: { timestamp: '2026-10-13T09:00:00Z', status: 422, code: SQL_TIMEOUT, message: Sorğu 2000 ms-dən çox çəkdi və dayandırıldı, details: [], traceId: req_7f2c9a } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

